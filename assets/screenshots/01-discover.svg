<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 620" width="300" height="620" role="img" aria-label="发现页界面示意">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5f33e1"/>
      <stop offset="100%" stop-color="#8764ff"/>
    </linearGradient>
    <clipPath id="screen"><rect x="0" y="0" width="300" height="620" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#screen)">
    <rect width="300" height="620" fill="#f7f7fb"/>

    <!-- 状态栏 -->
    <text x="20" y="26" font-size="11" font-weight="600" fill="#24252c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">9:41</text>
    <g fill="#24252c">
      <rect x="248" y="18" width="14" height="8" rx="2" opacity="0.85"/>
      <circle cx="268" cy="22" r="3.5" opacity="0.85"/>
      <circle cx="277" cy="22" r="3" opacity="0.5"/>
    </g>

    <!-- 标题栏 -->
    <text x="20" y="62" font-size="19" font-weight="700" fill="#24252c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">名人雷达</text>
    <text x="20" y="80" font-size="10.5" fill="#9b97ab" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">输入名字，联网检索近期公开报道</text>

    <!-- 搜索框 -->
    <rect x="20" y="92" width="260" height="40" rx="12" fill="#ffffff" stroke="#f0eff5"/>
    <circle cx="42" cy="112" r="6.5" fill="none" stroke="#9b97ab" stroke-width="1.8"/>
    <line x1="47" y1="117" x2="51" y2="121" stroke="#9b97ab" stroke-width="1.8" stroke-linecap="round"/>
    <text x="62" y="116" font-size="11.5" fill="#9b97ab" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">搜索名人，如：雷军</text>

    <!-- 领域筛选 -->
    <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5">
      <rect x="20" y="146" width="58" height="26" rx="13" fill="#5f33e1"/>
      <text x="49" y="163" fill="#ffffff" text-anchor="middle">全部</text>
      <rect x="84" y="146" width="58" height="26" rx="13" fill="#e7f3ff"/>
      <text x="113" y="163" fill="#0087ff" text-anchor="middle">科技</text>
      <rect x="148" y="146" width="58" height="26" rx="13" fill="#ffe9e1"/>
      <text x="177" y="163" fill="#ff7d53" text-anchor="middle">商业</text>
      <rect x="212" y="146" width="58" height="26" rx="13" fill="#ede8ff"/>
      <text x="241" y="163" fill="#5f33e1" text-anchor="middle">娱乐</text>
    </g>

    <!-- 热门榜标题 -->
    <text x="20" y="202" font-size="13" font-weight="700" fill="#24252c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">今日热门</text>
    <text x="280" y="202" font-size="10" fill="#9b97ab" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">AI 每日更新</text>

    <!-- 榜单条目 -->
    <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
      <rect x="20" y="214" width="260" height="62" rx="14" fill="#ffffff"/>
      <rect x="32" y="228" width="34" height="34" rx="17" fill="url(#hero)"/>
      <text x="49" y="250" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">雷</text>
      <text x="78" y="240" font-size="12.5" font-weight="600" fill="#24252c">雷军</text>
      <rect x="116" y="230" width="34" height="16" rx="8" fill="#e7f3ff"/>
      <text x="133" y="242" font-size="9" fill="#0087ff" text-anchor="middle">科技</text>
      <text x="78" y="258" font-size="10" fill="#9b97ab">2 小时前有新动态</text>
      <circle cx="266" cy="245" r="3.5" fill="#ef4444"/>

      <rect x="20" y="284" width="260" height="62" rx="14" fill="#ffffff"/>
      <rect x="32" y="298" width="34" height="34" rx="17" fill="#ff7d53"/>
      <text x="49" y="320" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">马</text>
      <text x="78" y="310" font-size="12.5" font-weight="600" fill="#24252c">马斯克</text>
      <rect x="130" y="300" width="34" height="16" rx="8" fill="#ffe9e1"/>
      <text x="147" y="312" font-size="9" fill="#ff7d53" text-anchor="middle">商业</text>
      <text x="78" y="328" font-size="10" fill="#9b97ab">昨天有新动态</text>

      <rect x="20" y="354" width="260" height="62" rx="14" fill="#ffffff"/>
      <rect x="32" y="368" width="34" height="34" rx="17" fill="#ec4899"/>
      <text x="49" y="390" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">周</text>
      <text x="78" y="380" font-size="12.5" font-weight="600" fill="#24252c">周杰伦</text>
      <rect x="130" y="370" width="34" height="16" rx="8" fill="#fce7f3"/>
      <text x="147" y="382" font-size="9" fill="#ec4899" text-anchor="middle">娱乐</text>
      <text x="78" y="398" font-size="10" fill="#9b97ab">3 天前有新动态</text>
    </g>

    <!-- 底部菜单 -->
    <rect x="0" y="548" width="300" height="72" fill="#ffffff"/>
    <line x1="0" y1="548" x2="300" y2="548" stroke="#f0eff5"/>
    <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5" text-anchor="middle">
      <circle cx="45" cy="576" r="8" fill="#5f33e1"/>
      <text x="45" y="604" fill="#5f33e1">发现</text>
      <circle cx="115" cy="576" r="8" fill="#e5e3ef"/>
      <text x="115" y="604" fill="#9b97ab">AI 提问</text>
      <circle cx="185" cy="576" r="8" fill="#e5e3ef"/>
      <text x="185" y="604" fill="#9b97ab">收藏</text>
      <circle cx="255" cy="576" r="8" fill="#e5e3ef"/>
      <text x="255" y="604" fill="#9b97ab">我的</text>
    </g>
  </g>
</svg>
