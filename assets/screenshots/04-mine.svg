<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 620" width="300" height="620" role="img" aria-label="我的页界面示意">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5f33e1"/>
      <stop offset="100%" stop-color="#8764ff"/>
    </linearGradient>
    <clipPath id="screen"><rect x="0" y="0" width="300" height="620" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#screen)">
    <rect width="300" height="620" fill="#f7f7fb"/>

    <!-- 状态栏 -->
    <text x="20" y="26" font-size="11" font-weight="600" fill="#24252c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">9:41</text>
    <g fill="#24252c">
      <rect x="248" y="18" width="14" height="8" rx="2" opacity="0.85"/>
      <circle cx="268" cy="22" r="3.5" opacity="0.85"/>
      <circle cx="277" cy="22" r="3" opacity="0.5"/>
    </g>

    <!-- 标题 -->
    <text x="20" y="60" font-size="17" font-weight="700" fill="#24252c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">我的</text>

    <!-- 账号行 -->
    <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
      <circle cx="42" cy="96" r="20" fill="#ede8ff"/>
      <text x="42" y="102" font-size="13" font-weight="700" fill="#5f33e1" text-anchor="middle">访</text>
      <text x="74" y="94" font-size="13" font-weight="600" fill="#24252c">微信用户</text>
      <rect x="74" y="102" width="46" height="17" rx="8.5" fill="#f0eff5"/>
      <text x="97" y="114" font-size="9.5" fill="#6e6a7c" text-anchor="middle">免费版</text>
    </g>

    <!-- 会员卡 -->
    <rect x="20" y="132" width="260" height="96" rx="16" fill="url(#card)"/>
    <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
      <text x="38" y="160" font-size="13" font-weight="700" fill="#ffffff">开通会员</text>
      <text x="38" y="180" font-size="9.5" fill="#ffffff" opacity="0.85">每日生成 3 → 30 次 · 解锁标准版 / 深度推理</text>
      <text x="38" y="196" font-size="9.5" fill="#ffffff" opacity="0.85">深度报告、周报与关键词预警不限次</text>
      <rect x="38" y="206" width="72" height="22" rx="11" fill="#ffffff"/>
      <text x="74" y="221" font-size="10.5" font-weight="600" fill="#5f33e1" text-anchor="middle">查看权益</text>
      <text x="262" y="221" font-size="9" fill="#ffffff" opacity="0.7" text-anchor="end">¥9.9 起</text>
    </g>

    <!-- 用量卡 -->
    <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
      <rect x="20" y="240" width="260" height="96" rx="16" fill="#ffffff"/>
      <text x="34" y="264" font-size="12.5" font-weight="700" fill="#24252c">今日用量</text>
      <text x="34" y="288" font-size="10.5" fill="#6e6a7c">报告生成</text>
      <text x="266" y="288" font-size="10.5" fill="#24252c" text-anchor="end">已用 2 / 3 次</text>
      <rect x="34" y="298" width="232" height="6" rx="3" fill="#f0eff5"/>
      <rect x="34" y="298" width="154" height="6" rx="3" fill="#5f33e1"/>

      <text x="34" y="322" font-size="10.5" fill="#6e6a7c">AI 提问</text>
      <text x="266" y="322" font-size="10.5" fill="#24252c" text-anchor="end">已用 1 / 5 次</text>
    </g>

    <!-- 设置列表 -->
    <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
      <rect x="20" y="348" width="260" height="204" rx="16" fill="#ffffff"/>
      <text x="34" y="374" font-size="11.5" fill="#24252c">生成模型</text>
      <text x="266" y="374" font-size="10" fill="#9b97ab" text-anchor="end">极速版 ›</text>
      <line x1="34" y1="388" x2="266" y2="388" stroke="#f7f7fb"/>

      <text x="34" y="412" font-size="11.5" fill="#24252c">消息中心</text>
      <text x="266" y="412" font-size="10" fill="#9b97ab" text-anchor="end">2 条未读 ›</text>
      <line x1="34" y1="426" x2="266" y2="426" stroke="#f7f7fb"/>

      <text x="34" y="450" font-size="11.5" fill="#24252c">我的收藏</text>
      <text x="266" y="450" font-size="10" fill="#9b97ab" text-anchor="end">›</text>
      <line x1="34" y1="464" x2="266" y2="464" stroke="#f7f7fb"/>

      <text x="34" y="488" font-size="11.5" fill="#24252c">浏览历史</text>
      <text x="266" y="488" font-size="10" fill="#9b97ab" text-anchor="end">›</text>
      <line x1="34" y1="502" x2="266" y2="502" stroke="#f7f7fb"/>

      <text x="34" y="526" font-size="11.5" fill="#24252c">隐私与免责</text>
      <text x="266" y="526" font-size="10" fill="#9b97ab" text-anchor="end">›</text>
    </g>

    <!-- 底部菜单 -->
    <rect x="0" y="548" width="300" height="72" fill="#ffffff"/>
    <line x1="0" y1="548" x2="300" y2="548" stroke="#f0eff5"/>
    <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5" text-anchor="middle">
      <circle cx="45" cy="576" r="8" fill="#e5e3ef"/>
      <text x="45" y="604" fill="#9b97ab">发现</text>
      <circle cx="115" cy="576" r="8" fill="#e5e3ef"/>
      <text x="115" y="604" fill="#9b97ab">AI 提问</text>
      <circle cx="185" cy="576" r="8" fill="#e5e3ef"/>
      <text x="185" y="604" fill="#9b97ab">收藏</text>
      <circle cx="255" cy="576" r="8" fill="#5f33e1"/>
      <text x="255" y="604" fill="#5f33e1">我的</text>
    </g>
  </g>
</svg>
